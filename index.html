<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Documentação de Entregas</title>

    <link rel="icon" type="image/png" sizes="32x32" href="images/icone.png" />
    <link rel="apple-touch-icon" href="images/icone.png" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="brand">
        <div class="logo-box">
          <img src="images/icone.png" alt="Logo" />
        </div>

        <div>
          <div class="topbar-title" id="topName">Sistema</div>

          <div class="topbar-sub">Documentação de versões</div>
        </div>
      </div>

      <div class="topbar-actions">
        <a href="login.html" class="btn btn-ghost"> Área administrativa </a>
      </div>
    </header>

    <div class="main">
      <aside>
        <div class="prod-switcher">
          <label for="prod-sel"> Produto </label>

          <select id="prod-sel"></select>
        </div>

        <div class="aside-label">Versões</div>

        <ul class="version-list" id="ver-list"></ul>
      </aside>

      <main id="main-content"></main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        App.initPublic();
      });
    </script>
  </body>
</html>
