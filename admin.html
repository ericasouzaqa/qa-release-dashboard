<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administração | QA Release Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="admin">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">QA</div>
        <div>
          <strong>QA Release Dashboard</strong>
          <span>Administração de qualidade</span>
        </div>
      </div>

      <div class="topbar-user">
        <span id="admin-user-name">Administrador</span>
        <button id="admin-avatar" class="avatar" type="button">A</button>
      </div>
    </header>

    <main class="admin-shell">
      <aside class="admin-sidebar">
        <button class="admin-nav active" data-section="releases">
          Releases
        </button>
        <button class="admin-nav" data-section="users">Usuários</button>
        <button class="admin-nav" data-section="groups">
          Grupos de e-mail
        </button>

        <div class="sidebar-bottom">
          <a href="index.html" class="btn btn-secondary btn-full"
            >Voltar ao dashboard</a
          >
          <button id="admin-logout" class="btn btn-ghost btn-full">Sair</button>
        </div>
      </aside>

      <section id="admin-content" class="admin-content"></section>
    </main>

    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/export.js"></script>
    <script src="js/email.js"></script>
    <script src="js/release.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        Auth.requireAdmin();
        Release.initAdmin();
      });
    </script>
  </body>
</html>
